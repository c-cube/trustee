name: build
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  run:
    name: build  # build+test on various versions of OCaml, on linux
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-5.0:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules:
          recursive
    - run: opam pin -n .
    - run: apt update && opam install -t . --deps-only
    - run: opam exec -- dune build -p trustee,trustee-opentheory
    - run: opam exec -- dune runtest -p trustee,trustee-opentheory

  docker:
    name: docker image
    needs: run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v6
      with:
        submodules:
          recursive
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/c-cube/trustee:latest
          ghcr.io/c-cube/trustee:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
