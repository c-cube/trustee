name: build
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  run:
    name: build  # build+test on various versions of OCaml, on linux
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-5.0:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules:
          recursive
    - run: opam pin -n .
    - run: apt update && opam install -t . --deps-only
    - run: opam exec -- dune build -p trustee,trustee-opentheory
    - run: opam exec -- dune runtest -p trustee,trustee-opentheory

  docker:
    name: docker image
    needs: run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: c-cube/c-cube-common/.github/workflows/docker-publish.yml@170b6600d0c23345f76d93ddb123462f982f9f6c
    with:
      submodules: true
